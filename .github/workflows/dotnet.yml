name: Compilar y probar Inmobiliaria

# Se ejecuta al hacer push o crear un pull request hacia main.
# También permite iniciar el workflow manualmente desde GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # 1) Descarga el código fuente del repositorio.
      # Incluimos el historial completo para que Sonar pueda comparar los cambios.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # 2) Instala el SDK de .NET 10 que utiliza Inmobiliaria.
      # Así el runner compila con la versión correspondiente al proyecto.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # 3) Restaura los paquetes NuGet de toda la solución.
      # EnableWindowsTargeting permite compilar Windows Forms desde Ubuntu.
      # Hasta el escritorio tiene que pasar lista.
      - name: Restore dependencies
        run: dotnet restore Inmobiliaria.sln -p:EnableWindowsTargeting=true

      # 4) Instala SonarScanner para analizar el código .NET.
      # Este paso se ejecuta cuando está configurado el secreto SONAR_TOKEN.
      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # 5) Avisa si falta SONAR_TOKEN y continúa con la compilación y las pruebas.
      # El análisis de Sonar se activará cuando configuremos el secreto.
      - name: SonarCloud analysis skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "Configura el secreto SONAR_TOKEN para activar SonarQube Cloud."

      # 6) Inicia el análisis en nuestra cuenta de SonarQube Cloud.
      # Los resultados llegarán al proyecto apifinal.
      - name: Begin SonarCloud analysis
        id: sonar_begin
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet sonarscanner begin \
            /o:"haillkira" \
            /k:"haillkira_apifinal" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      # 7) Compila toda la solución en modo Release.
      # --no-restore aprovecha los paquetes descargados en el paso 3.
      # Aquí el "en mi máquina funciona" también tiene que convencer a Ubuntu.
      - name: Build solution
        id: compilacion
        run: dotnet build Inmobiliaria.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

      # 8) Ejecuta las pruebas de servicios y web y genera sus reportes TRX.
      # Primero comprobamos los servicios.
      # Las pruebas de integración se compilan en el paso 7.
      # Su ejecución requiere la instancia SQLEXPRESS configurada en Windows.
      - name: Test services
        if: ${{ !cancelled() && steps.compilacion.outcome == 'success' }}
        run: dotnet test tests/Inmobiliaria.Application.UnitTests/Inmobiliaria.Application.UnitTests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=servicios.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Continuación del paso 8: comprobamos la web.
      # Si los servicios fallan, la web todavía tiene su propio examen.
      - name: Test web
        if: ${{ !cancelled() && steps.compilacion.outcome == 'success' }}
        run: dotnet test tests/Inmobiliaria.Web.Tests/Inmobiliaria.Web.Tests.csproj --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=web.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Continuación del paso 8: comprobamos las claves y firmas JWT sin depender de SQL.
      - name: Test JWT security
        if: ${{ !cancelled() && steps.compilacion.outcome == 'success' }}
        run: dotnet test tests/Inmobiliaria.IntegrationTests/Inmobiliaria.IntegrationTests.csproj --configuration Release --no-build --filter FullyQualifiedName~SeguridadJwtTests --logger "trx;LogFileName=seguridad.trx" --results-directory TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # 9) Finaliza el análisis y envía los resultados a SonarQube Cloud.
      # Se ejecuta si Sonar inició y la solución compiló correctamente,
      # incluso cuando alguna prueba haya fallado.
      - name: End SonarCloud analysis
        if: ${{ !cancelled() && steps.sonar_begin.outcome == 'success' && steps.compilacion.outcome == 'success' }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # 10) Publica los resultados directamente en GitHub Checks.
      # Solo intenta publicarlos cuando existen archivos TRX y el contexto
      # permite escribir checks, evitando otro error si las pruebas no arrancaron.
      - name: Publish test results
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4 # v2
        if: ${{ !cancelled() && hashFiles('TestResults/**/*.trx') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Resultados .NET - Servicios y Web
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
